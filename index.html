  <style>
    :root {
      --navy:#073b67;
      --navy-dark:#052e52;
      --blue:#078bea;
      --cyan:#14aee9;
      --green:#35ad55;
      --orange:#ff6900;
      --purple:#842bc3;
      --pink:#e72f68;
      --light:#f3f9fd;
      --text:#0a3157;
      --muted:#526a80;
      --white:#ffffff;
      --shadow:0 10px 28px rgba(5,46,82,.10);
      --radius:18px;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body { font-family:Arial, Helvetica, sans-serif; color:var(--text); background:#fff; line-height:1.5; }
    a { color:inherit; text-decoration:none; }
    .container { width:min(1180px, 90%); margin:auto; }

    /* NAVIGATION */
    header { background:#fff; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,.05); }
    nav { min-height:78px; display:flex; align-items:center; justify-content:space-between; gap:30px; }
    .brand { font-size:28px; font-weight:800; color:var(--navy); line-height:1; }
    .brand span { color:var(--blue); }
    .brand small { display:block; margin-top:7px; font-size:11px; font-weight:500; letter-spacing:.5px; }
    .navlinks { display:flex; align-items:center; gap:27px; font-size:14px; font-weight:700; }

    .button { display:inline-block; padding:13px 22px; border-radius:28px; font-weight:700; font-size:14px; transition:.2s ease; }
    .button:hover { transform:translateY(-2px); }
    .button-blue { background:linear-gradient(90deg,var(--blue),var(--cyan)); color:#fff; }
    .button-outline { border:1.5px solid #fff; color:#fff; }

    /* HERO */
    .hero {
      background:
        radial-gradient(circle at 80% 20%, rgba(20,174,233,.24), transparent 28%),
        linear-gradient(120deg,var(--navy-dark),var(--navy));
      color:#fff;
      padding:80px 0;
    }
    .hero-grid { display:grid; grid-template-columns:1.15fr .85fr; gap:70px; align-items:center; }
    .eyebrow { color:#28b9ff; font-weight:800; text-transform:uppercase; font-size:13px; letter-spacing:.7px; margin-bottom:12px; }
    .hero h1 { font-size:52px; line-height:1.05; max-width:700px; margin-bottom:22px; }
    .hero h1 span { color:#24b4ff; }
    .hero p { font-size:20px; max-width:660px; color:#eaf6ff; }
    .hero-actions { display:flex; gap:14px; margin-top:32px; flex-wrap:wrap; }
    .hero-panel { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:24px; padding:30px; backdrop-filter:blur(6px); }
    .hero-panel h3 { font-size:23px; margin-bottom:22px; }
    .hero-steps { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; }
    .hero-step { background:rgba(255,255,255,.09); padding:18px; border-radius:14px; }
    .hero-step strong { display:block; color:#39bfff; margin-bottom:4px; }
    .hero .identity { margin-top:22px; padding-left:16px; border-left:4px solid var(--cyan); font-size:18px; }
    .hero .identity strong { color:#fff; }
    .hero-step span { font-size:14px; color:#d6ecfb; }

    /* SECTIONS */
    section { padding:75px 0; }
    section.alt { background:var(--light); }
    .section-title { max-width:800px; margin-bottom:38px; }
    .section-title h2 { font-size:38px; line-height:1.1; margin-bottom:12px; }
    .section-title p { color:var(--muted); font-size:17px; }

    /* DECISION */
    .decision-grid { display:grid; grid-template-columns:.9fr 1.25fr .75fr; gap:32px; align-items:center; }
    .decision-copy h2 { font-size:38px; line-height:1.05; margin-bottom:18px; }
    .decision-copy p { margin-bottom:14px; }
    .decision-copy .role { color:var(--blue); font-weight:700; font-size:18px; }
    .decision-map { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .decision-map div { padding:16px; border-radius:12px; color:#fff; text-align:center; font-weight:700; font-size:13px; }
    .decision-map div:nth-child(1){background:#2d9de0;}
    .decision-map div:nth-child(2){background:#61b858;}
    .decision-map div:nth-child(3){background:#9636bd;}
    .decision-map div:nth-child(4){background:#ef812a;}
    .decision-map div:nth-child(5){background:#079ca8;}
    .decision-map div:nth-child(6){background:#e7476a;}
    .decision-map div:nth-child(7){background:#2d9de0;}
    .buyer { grid-column:1 / -1; background:var(--navy)!important; font-size:18px!important; }
    .decision-caption { margin-top:14px; text-align:center; font-weight:700; color:var(--navy); }
    .targets { background:#eaf6fd; border-radius:18px; padding:25px; }
    .targets h3 { margin-bottom:15px; }
    .targets ul { list-style:none; }
    .targets li { margin:11px 0; padding-left:18px; position:relative; font-size:14px; }
    .targets li:before { content:"•"; position:absolute; left:0; color:var(--blue); font-weight:bold; }

    /* OFFRES */
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
    .card { background:#fff; padding:26px; border-radius:var(--radius); box-shadow:var(--shadow); display:flex; flex-direction:column; min-height:310px; }
    .number { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; margin-bottom:18px; }
    .card h3 { font-size:19px; margin-bottom:8px; }
    .card h4 { margin-bottom:11px; font-size:14px; text-transform:uppercase; }
    .card p { font-size:14px; color:var(--muted); margin-bottom:20px; }
    .card .button { margin-top:auto; text-align:center; color:#fff; }
    .card .offer-meta { font-size:13px; color:var(--text); margin-bottom:8px; }
    .card .offer-meta b { display:block; font-size:12px; color:var(--muted); }
    .card .offer-last { margin-bottom:20px; }
    .blue .number,.blue .button {background:var(--blue);}
    .green .number,.green .button {background:var(--green);}
    .orange .number,.orange .button {background:var(--orange);}
    .purple .number,.purple .button {background:var(--purple);}

    /* AXES */
    .axes { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
    .axis { text-align:center; padding:20px 12px; border-radius:14px; background:#fff; box-shadow:var(--shadow); }
    .axis-icon { width:48px; height:48px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:20px; }
    .axis:nth-child(1) .axis-icon {background:var(--blue);}
    .axis:nth-child(2) .axis-icon {background:var(--green);}
    .axis:nth-child(3) .axis-icon {background:var(--orange);}
    .axis:nth-child(4) .axis-icon {background:var(--purple);}
    .axis:nth-child(5) .axis-icon {background:var(--pink);}
    .axis h3 { font-size:15px; }
    .axis p { font-size:13px; color:var(--muted); margin-top:8px; }
    .journey { display:grid; grid-template-columns:2fr 2fr 1fr; margin-top:18px; color:#fff; font-weight:800; text-align:center; }
    .journey div { padding:9px; }
    .journey div:nth-child(1){background:var(--blue);}
    .journey div:nth-child(2){background:var(--green);}
    .journey div:nth-child(3){background:var(--pink);}
    .journey small { display:block; font-weight:400; font-size:12px; opacity:.9; }

    /* PARCOURS */
    .expert-grid { display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:center; }
    .expert-copy h2 { font-size:38px; line-height:1.08; margin-bottom:18px; }
    .expert-copy p { margin-bottom:14px; }
    .expert-copy .roles { list-style:none; margin:18px 0 0; }
    .expert-copy .roles li { padding:8px 0; border-top:1px solid #dbe7f0; font-size:15px; }
    .stats { display:grid; grid-template-columns:0.8fr 1fr 1.3fr; gap:18px; margin:30px 0; }
    .stat strong { display:block; color:var(--blue); font-size:29px; white-space:nowrap; }
    .stat span { display:block; font-size:13px; }
    .stat-text strong { font-size:20px; white-space:normal; line-height:1.2; padding-top:6px; }
    .expert-photo {
      min-height:390px;
      border-radius:22px;
      background:linear-gradient(135deg,rgba(5,46,82,.95),rgba(7,139,234,.7));
      display:flex; align-items:center; justify-content:center;
      color:#fff; text-align:center; padding:35px;
    }
    .expert-photo img { max-width:100%; height:auto; border-radius:14px; }

    /* INTERVENTIONS */
    .timeline { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:30px; }
    .event { border-left:4px solid var(--blue); background:#fff; box-shadow:var(--shadow); padding:22px; border-radius:0 14px 14px 0; }
    .event strong { color:var(--blue); display:block; margin-bottom:7px; }

    /* FAQ */
    .faq details { background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:20px 24px; margin-bottom:12px; max-width:860px; }
    .faq summary { font-weight:700; font-size:17px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:20px; }
    .faq summary::-webkit-details-marker { display:none; }
    .faq summary::after { content:"+"; color:var(--blue); font-size:22px; line-height:1; }
    .faq details[open] summary::after { content:"–"; }
    .faq details p { margin-top:12px; color:var(--muted); }

    /* CONTACT */
    .final-cta { background:linear-gradient(110deg,var(--navy-dark),var(--navy)); color:#fff; padding:55px 0; }
    .cta-grid { display:flex; align-items:center; justify-content:space-between; gap:30px; }
    .cta-grid h2 { font-size:32px; margin-bottom:8px; }
    .cta-buttons { display:flex; gap:12px; flex-wrap:wrap; }
    .final-cta .cta-steps { list-style:none; margin:18px 0 6px; counter-reset:step; }
    .final-cta .cta-steps li { counter-increment:step; position:relative; padding-left:38px; margin:10px 0; color:#eaf6ff; }
    .final-cta .cta-steps li::before {
      content:counter(step); position:absolute; left:0; top:-1px;
      width:26px; height:26px; border-radius:50%; background:var(--cyan);
      color:#fff; font-weight:800; font-size:14px;
      display:flex; align-items:center; justify-content:center;
    }
    .final-cta .direct { margin-top:14px; font-size:14px; color:#cfe6f7; }
    .final-cta .direct a { text-decoration:underline; }

    /* PIED DE PAGE */
    footer { padding:35px 0; background:#fff; }
    .footer-grid { display:grid; grid-template-columns:1fr 2fr 1fr; gap:25px; align-items:center; font-size:13px; }
    .contact-line { display:flex; flex-wrap:wrap; gap:18px; }
    .legal { text-align:right; color:var(--muted); }

    a:focus-visible, summary:focus-visible { outline:3px solid var(--cyan); outline-offset:3px; }

    /* TABLETTE */
    @media(max-width:950px) {
      .navlinks { display:none; }
      .hero-grid, .decision-grid, .expert-grid { grid-template-columns:1fr; }
      .cards { grid-template-columns:repeat(2,1fr); }
      .axes { grid-template-columns:repeat(2,1fr); }
      .timeline { grid-template-columns:1fr; }
      .footer-grid { grid-template-columns:1fr; }
      .legal { text-align:left; }
    }

    /* MOBILE : bloc unique */
    @media (max-width:600px) {
      html, body { width:100%; max-width:100%; overflow-x:hidden; }
      .container { width:100%; max-width:100%; padding-left:22px; padding-right:22px; }

      header { padding:18px 0; }
      nav { display:block; }
      .brand { font-size:30px; line-height:1.05; }
      .brand small { font-size:13px; margin-top:7px; }

      .hero { padding:48px 0 52px; overflow:hidden; }
      .hero-grid { display:block; }
      .hero h1 { font-size:40px; line-height:1.06; letter-spacing:-1px; overflow-wrap:break-word; }
      .hero p { font-size:18px; line-height:1.5; max-width:100%; }
      .hero-panel { margin-top:32px; padding:22px; }
      .hero-steps { grid-template-columns:1fr; gap:12px; }
      .hero-step { padding:16px 14px; }
      .hero-step strong { font-size:20px; }

      .section-title h2, .decision-copy h2, .expert-copy h2 { font-size:32px; line-height:1.1; letter-spacing:-.5px; overflow-wrap:break-word; }
      .section-title p, .decision-copy p, .expert-copy p { font-size:17px; line-height:1.55; }

      .decision-grid, .expert-grid, .cards, .axes, .stats, .journey, .timeline, .footer-grid { grid-template-columns:1fr; }

      .card { padding:28px 24px; min-height:0; }

      .stats { gap:20px; }
      .stat strong { font-size:34px; white-space:normal; }
      .stat span { font-size:16px; line-height:1.4; }
      .stat-text strong { font-size:22px; }

      .expert-photo { min-height:0; padding:0; background:none; }
      .expert-photo img { width:100%; border-radius:18px; }

      .cta-grid { display:block; }
      .cta-buttons { margin-top:25px; }
      .button { max-width:100%; white-space:normal; text-align:center; }

      .contact-line { flex-direction:column; align-items:flex-start; gap:8px; }
      .legal { text-align:left; }
      img { max-width:100%; height:auto; }
    }
  </style>
</head>
